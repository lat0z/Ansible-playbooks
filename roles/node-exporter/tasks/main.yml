---
- name: Ensure group node_exporter exists
  become: true
  ansible.builtin.group:
    name: node_exporter
    system: yes
    state: present

- name: Create node_exporter user
  become: true
  ansible.builtin.user:
    name: node_exporter
    shell: /bin/bash
    system: yes
    state: present
    group: node_exporter
    comment: node_exporter owner

- name: Download the node_exporter package
  become: true
  ansible.builtin.unarchive:
    src: "https://github.com/prometheus/node_exporter/releases/download/v{{ version }}/node_exporter-{{ version }}.{{ arch }}.tar.gz"
    dest: /tmp #/usr/local/bin/prometheus
    remote_src: yes

- name: Copy the prometheus binaries to /usr/local/bin
  become: true
  ansible.builtin.copy:
    src: "/tmp/node_exporter-{{ version }}.{{ arch }}/{{ item.f }}"
    dest: "/usr/local/bin/"
    owner: "{{ item.u }}"
    group: "{{ item.u }}"
    mode: "0755"
    remote_src: yes
  with_items:
    - { f: "node_exporter", u: "node_exporter" }

- name: Copy the systemd service
  become: true
  ansible.builtin.copy:
    src: node_exporter.service
    dest: /etc/systemd/system/
    owner: root
    group: root
    remote_src: no

- name: Make sure the node_exporter service is running
  become: true
  ansible.builtin.systemd:
    name: node_exporter.service
    state: started
    enabled: yes
